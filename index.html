    <!-- Main Content -->
    <div class="flex-grow container mx-auto px-4 py-8">
      <div class="flex flex-col lg:flex-row gap-6">
        <!-- Input Form -->
        <div class="lg:w-1/3">
          <div class="glassmorphism rounded-xl p-6 shadow-lg">
            <h3 class="text-xl font-semibold mb-4 text-primary-light">
              Como gostaria de iniciar seu patrimônio?
            </h3>
            <div class="mb-4">
              <label
                for="initialInvestment"
                class="block text-sm font-medium text-gray-300 mb-1"
                >Investimento inicial:</label
              >
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                >
                  <span class="text-gray-400">R$</span>
                </div>
                <input
                  type="number"
                  id="initialInvestment"
                  class="bg-dark-light bg-opacity-50 border border-gray-600 text-white pl-10 py-2.5 rounded-lg w-full focus:ring-primary focus:border-primary focus:outline-none"
                  placeholder="1.000,00"
                />
              </div>
            </div>

            <div class="mb-4">
              <label
                for="monthlyContribution"
                class="block text-sm font-medium text-gray-300 mb-1"
                >Valor dos aportes mensais:</label
              >
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                >
                  <span class="text-gray-400">R$</span>
                </div>
                <input
                  type="number"
                  id="monthlyContribution"
                  class="bg-dark-light bg-opacity-50 border border-gray-600 text-white pl-10 py-2.5 rounded-lg w-full focus:ring-primary focus:border-primary focus:outline-none"
                  placeholder="100,00"
                />

            </div>

            <div class="mb-6">
              <label
                for="investmentPeriod"
                class="block text-sm font-medium text-gray-300 mb-1"
                >Período da aplicação:</label
              >
              <div class="flex gap-2">
                <input
                  type="number"
                  id="investmentPeriod"
                  class="bg-dark-light bg-opacity-50 border border-gray-600 text-white py-2.5 px-3 rounded-lg flex-grow focus:ring-primary focus:border-primary focus:outline-none"
                  placeholder="1"
                />
                <select
                  id="periodType"
                  class="bg-dark-light bg-opacity-50 border border-gray-600 text-white py-2.5 px-3 rounded-lg w-1/3 focus:ring-primary focus:border-primary focus:outline-none"
                >
                  <option value="years">anos</option>
                  <option value="months">meses</option>
                </select>
              </div>
            </div>

            <button
              onclick="calcularRetornos()"
              class="w-full py-3 bg-primary hover:bg-primary-hover text-white font-medium rounded-lg transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
            >
              Ver simulação
            </button>
          </div>
        </div>

        <!-- Results -->
        <div id="melhoresOPC" class="lg:w-2/3">
          <div class="glassmorphism rounded-xl p-6 shadow-lg">
            <div id="results" class="mb-6 overflow-x-auto"></div>
            <div id="container" class="chart-container"></div>

    <!-- Footer -->
    <footer class="mt-auto py-4 bg-dark-light bg-opacity-30">
      <div class="container mx-auto px-4">
        <p class="text-center text-gray-400">
          MoneyGrow-FI - Simulador de Investimentos &copy; 2024
        </p>
      </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script>
      // Mobile menu toggle
      document
        .getElementById("mobileMenuButton")
        .addEventListener("click", function () {
          const menu = document.getElementById("mobileMenu");
          menu.classList.toggle("hidden");
        });

      // Initialize Highcharts with a dark theme
      Highcharts.setOptions({
        chart: {
          backgroundColor: "rgba(30, 41, 59, 0.8)",
          style: {
            fontFamily: "Inter, sans-serif",
          },
        },
        colors: [
          "#6366F1",
          "#8B5CF6",
          "#EC4899",
          "#10B981",
          "#F59E0B",
          "#EF4444",
          "#3B82F6",
        ],
        title: {
          style: {
            color: "#F9FAFB",
          },
        },
        legend: {
          itemStyle: {
            color: "#F9FAFB",
          },
          itemHoverStyle: {
            color: "#D1D5DB",
          },
        },
        xAxis: {
          labels: {
            style: {
              color: "#9CA3AF",
            },
          },
          title: {
            style: {
              color: "#9CA3AF",
            },
          },
          gridLineColor: "rgba(75, 85, 99, 0.3)",
          lineColor: "rgba(75, 85, 99, 0.6)",
          tickColor: "rgba(75, 85, 99, 0.6)",
        },
        yAxis: {
          labels: {
            style: {
              color: "#9CA3AF",
            },
          },
          title: {
            style: {
              color: "#9CA3AF",
            },
          },
          gridLineColor: "rgba(75, 85, 99, 0.3)",
        },
        tooltip: {
          backgroundColor: "rgba(17, 24, 39, 0.9)",
          style: {
            color: "#F9FAFB",
          },
        },
        plotOptions: {
          series: {
            marker: {
              fillColor: null,
              lineColor: null,
            },
          },
        },
      });
    </script>
    <script>
      let currentInvestmentIndex = 0;
      let investmentsKeys = [];
      let resultados = {};

      function plotAllInvestments() {
        const container = document.getElementById("container");

        const seriesData = investmentsKeys.map((investmentKey) => ({
          name: investmentKey,
          data: resultados[investmentKey].evolution,
        }));

        Highcharts.chart("container", {
          title: {
            text: "Evolução do Patrimônio",
          },
          xAxis: {
            categories: resultados[investmentsKeys[0]].evolution.map(
              (_, i) => i + 1
            ),
            title: {
              text: "Meses",
            },
          },
          yAxis: {
            title: {
              text: "Patrimônio (R$)",
            },
            labels: {
              formatter: function () {
                return this.value.toLocaleString("pt-BR", {
                  style: "currency",
                  currency: "BRL",
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2,
                });
              },
            },
          },
          tooltip: {
            pointFormatter: function () {
              return `<span style="color:${this.color}">\u25CF</span> ${
                this.series.name
              }: <b>${this.y.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              })}</b><br/>`;
            },
          },
          legend: {
            enabled: true,
          },
          plotOptions: {
            series: {
              lineWidth: 2,
              marker: {
                enabled: false,
              },
              states: {
                hover: {
                  lineWidth: 3,
                },
              },
            },
          },
          series: seriesData,
        });
      }

      // consumo da API do BCB para buscar o último CDI
      async function buscarUltimoCDI() {
        const url =
          "https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados/ultimos/1?formato=json";
        try {
          const resposta = await fetch(url);
          if (!resposta.ok) {
            throw new Error("Falha ao obter dados do CDI");
          }
          const dados = await resposta.json();
          return parseFloat(dados[0].valor);
        } catch (erro) {
          console.error("Erro ao buscar CDI:", erro);
          return 10.4; // Valor padrão caso a API falhe
        }
      }

      // calcular juros compostos com aplicação de IR
      function jurosCompostos(
        capitalInicial,
        taxa,
        tempo,
        aporteMensal,
        tributavel
      ) {
        let montante = capitalInicial;
        let evolution = [];
        for (let i = 0; i < tempo * 12; i++) {
          montante = (montante + aporteMensal) * (1 + taxa / 12);
          evolution.push(montante);
        }

        let contribuicaoTotal = capitalInicial + aporteMensal * tempo * 12;
        let lucro = montante - contribuicaoTotal;

        if (tributavel) {
          let taxaIR = obterTaxaIR(tempo);
          lucro *= 1 - taxaIR;
        }

        let retornoLiquido = contribuicaoTotal + lucro;
        let retornoSemInicial = retornoLiquido - capitalInicial;
        let retornoMensalMedio = tempo > 2 / 12 ? lucro / (tempo * 12) : 0;

        return {
          retornoLiquido,
          retornoSemInicial,
          retornoMensalMedio,
          evolution,
        };
      }

      function obterTaxaIR(anos) {
        if (anos <= 0.5) return 0.225;
        else if (anos <= 1) return 0.2;
        else if (anos <= 2) return 0.175;
        else return 0.15;
      }

      function anualizarCDI(taxaDiaria) {
        const diasUteisAno = 252;
        const taxaDiariaDecimal = taxaDiaria / 100;
        const taxaAnualizada =
          (Math.pow(1 + taxaDiariaDecimal, diasUteisAno) - 1) * 100;
        return taxaAnualizada;
      }

      async function calcularRetornos() {
        const investimentoInicial =
          parseFloat(document.getElementById("initialInvestment").value) || 0;
        const aporteMensal =
          parseFloat(document.getElementById("monthlyContribution").value) || 0;
        const periodoInvestimento =
          parseInt(document.getElementById("investmentPeriod").value) || 0;
        const tipoPeriodo = document.getElementById("periodType").value;
        const anos =
          tipoPeriodo === "months"
            ? periodoInvestimento / 12
            : periodoInvestimento;

        const taxaCDIDecimal = await buscarUltimoCDI();
        const taxaCDIAnual = anualizarCDI(taxaCDIDecimal);

        if (!investimentoInicial || !periodoInvestimento) {
          alert("Preencha os campos corretamente");
          return;
        }

        const taxas = {
          selic: taxaCDIAnual / 100,
          cdi: taxaCDIAnual / 100,
          ipca: 0.0361,
          tr: 0.00092,
          tesouroPrefixado: 0.105,
          tesouroIPCA: 0.055,
          fundoDI: 0.09817,
          cdb: taxaCDIAnual / 100,
          lciLca: (taxaCDIAnual / 100) * 0.85,
          poupanca: 0.05925 / 12,
        };

        resultados = {
          "LCI e LCA": jurosCompostos(
            investimentoInicial,
            taxas.lciLca,
            anos,
            aporteMensal,
            false
          ),
          CDB: jurosCompostos(
            investimentoInicial,
            taxas.cdb,
            anos,
            aporteMensal,
            true
          ),
          "Tesouro Prefixado": jurosCompostos(
            investimentoInicial,
            taxas.tesouroPrefixado,
            anos,
            aporteMensal,
            true
          ),
          "Tesouro Selic": jurosCompostos(
            investimentoInicial,
            taxas.selic,
            anos,
            aporteMensal,
            false
          ),
          "Fundo DI": jurosCompostos(
            investimentoInicial,
            taxas.fundoDI,
            anos,
            aporteMensal,
            true
          ),
          "Tesouro IPCA+": jurosCompostos(
            investimentoInicial,
            taxas.tesouroIPCA,
            anos,
            aporteMensal,
            true
          ),
          "Correção pelo IPCA": jurosCompostos(
            investimentoInicial,
            taxas.ipca,
            anos,
            aporteMensal,
            false
          ),
        };

        investmentsKeys = Object.keys(resultados);

        plotAllInvestments();
        exibirResultados(resultados);
      }

      function exibirResultados(resultados) {
        const containerResultados = document.getElementById("results");
        containerResultados.innerHTML = `
              <div class="overflow-x-auto">
                  <table class="min-w-full divide-y divide-gray-600">
                      <thead>
                          <tr>
                              <th class="px-4 py-3 bg-gray-700 bg-opacity-50 text-left text-xs font-medium text-gray-300 uppercase tracking-wider rounded-tl-lg">Investimento</th>
                              <th class="px-4 py-3 bg-gray-700 bg-opacity-50 text-right text-xs font-medium text-gray-300 uppercase tracking-wider">Patrimônio final</th>
                              <th class="px-4 py-3 bg-gray-700 bg-opacity-50 text-right text-xs font-medium text-gray-300 uppercase tracking-wider">Retorno Líquido</th>
                              <th class="px-4 py-3 bg-gray-700 bg-opacity-50 text-right text-xs font-medium text-gray-300 uppercase tracking-wider rounded-tr-lg">Retorno Mensal Médio</th>
                          </tr>
                      </thead>
                      <tbody class="divide-y divide-gray-600">
                          ${Object.entries(resultados)
                            .map(
                              ([chave, valor], index) => `
                              <tr class="${
                                index % 2 === 0
                                  ? "bg-gray-800 bg-opacity-30"
                                  : "bg-gray-700 bg-opacity-30"
                              }">
                                  <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-white">${chave}</td>
                                  <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-200 text-right">${formatarMoeda(
                                    valor.retornoLiquido
                                  )}</td>
                                  <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-200 text-right">${formatarMoeda(
                                    valor.retornoSemInicial
                                  )}</td>
                                  <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-200 text-right">${formatarMoeda(
                                    valor.retornoMensalMedio
                                  )}</td>
                              </tr>
                          `
                            )
                            .join("")}
                      </tbody>
                  </table>
              </div>
          `;
      }

      function formatarMoeda(valor) {
        return valor.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }
    </script>
  </body>
